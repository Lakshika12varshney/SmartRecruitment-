<!DOCTYPE html>
<html>
<head>
    <title>Candidate Registration</title>
</head>
<body>

<h1>Candidate Registration</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Register</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>

</body>
</html>
