{% extends 'employees/base.html' %}

{% block content %}

<style>

    .schedule-container {
        max-width: 700px;
        margin: 50px auto;
        padding: 20px;
    }

    .schedule-box {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .schedule-box h1 {
        color: #173b7a;
        margin-bottom: 10px;
    }

    .candidate-info {
        color: #666;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .save-btn,
    .back-btn {
        flex: 1;
        padding: 13px;
        border-radius: 10px;
        text-align: center;
        text-decoration: none;
        font-weight: bold;
        border: none;
        cursor: pointer;
    }

    .save-btn {
        background: #173b7a;
        color: white;
    }

    .back-btn {
        background: #eee;
        color: #333;
    }

    @media (max-width: 600px) {
        .actions {
            flex-direction: column;
        }
    }

</style>


<div class="schedule-container">

    <div class="schedule-box">

        <h1>📅 Schedule Interview</h1>

        <p class="candidate-info">
            Candidate:
            <strong>{{ application.candidate.user.username }}</strong>
            <br>
            Job:
            <strong>{{ application.job.title }}</strong>
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Interview Date
                </label>

                <input
                    type="date"
                    name="interview_date"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Interview Time
                </label>

                <input
                    type="time"
                    name="interview_time"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Interview Mode
                </label>

                <select name="interview_mode" required>

                    <option value="">
                        Select Mode
                    </option>

                    <option value="Online">
                        Online
                    </option>

                    <option value="Offline">
                        Offline
                    </option>

                    <option value="Phone">
                        Phone
                    </option>

                </select>

            </div>


            <div class="actions">

                <button type="submit" class="save-btn">
                    ✅ Schedule Interview
                </button>

                <a
                    href="{% url 'hr_applications' %}"
                    class="back-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
